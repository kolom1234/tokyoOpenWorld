# 공용 셋업: pnpm(packageManager 필드 버전) + Node + 의존성 설치(--frozen-lockfile). see docs/13-deployment.md §7
name: Setup workspace
description: Install pnpm, Node.js and workspace dependencies
inputs:
  node-version:
    description: Node.js major version (ADR-0011 — 24 기본, 22 하한 매트릭스)
    required: false
    default: '24'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
