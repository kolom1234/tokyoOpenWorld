# Cloudflare 요금제 포함량 점검(M11-T06) + 비용 회로 차단기(ADR-0104, 30분마다): 요금제 = CF_PLAN(저장소 변수 — 없으면 paid: Workers Paid + R2, 2026-10-31 사용자 확인),
# 청구 주기(매월 CF_BILLING_DAY일 시작) 누적이 포함량의 70 %를 넘으면 라벨 cf-usage 이슈를 만든다(열린 이슈가 있으면 본문만 갱신 — 알림은 처음 한 번).
# 일일 값은 급증 참고표로만 쓴다. 토큰 권한 = Account Analytics: Read(+ 이름·로그용 권한은 docs/13-deployment.md §6).
# 차단기: ours 지표 > 90 % 또는 account 예상 추가 요금 > $1 → 라벨 cf-kill-switch 이슈 + 시크릿 CF_KILLSWITCH_TOKEN이 있으면 WAF 규칙 sanpo-kill-switch를 켠다
# (없으면 감시·이슈만). 해제는 자동으로 하지 않는다 — `pnpm killswitch off`(docs/13 §6). GitHub 일정은 몇 분 늦을 수 있고, 60일간 저장소 활동이 없으면 꺼진다.
# 30분 실행의 주 트리거 = Cloudflare Cron Worker `sanpo-usage-cron`(apps/usage-cron)의 workflow_dispatch(ADR-0106) — 아래 schedule은 백업.
# 감시 지연 경보: 변수 USAGE_CRON_ACTIVE=true이면 직전 성공 실행과 2시간 넘게 벌어졌을 때 라벨 cf-usage-watchdog 이슈(트리거·PAT 고장 감지).
# 시크릿 값은 node 프로세스 env로만 전달한다. 시크릿이 없으면 건너뛰고 성공.
name: Cloudflare usage

on:
  schedule:
    # 백업 트리거. GitHub는 부하가 큰 시각의 예약 실행을 늦추거나 버린다 — `*/30` 29회/7.2일, `13,43` 22회/6일(2026-11-08~14) 실측.
    # 정시성은 apps/usage-cron(Cloudflare Cron → workflow_dispatch, ADR-0106)이 맡는다. 70 % 이슈는 열린 것이 있으면 본문만 갱신 — 알림은 처음 한 번.
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read # 감시 지연 경보: 직전 실행 시각 조회

concurrency:
  group: cf-usage
  cancel-in-progress: false

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Cloudflare secrets
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: echo "enabled=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 24
      - name: Watchdog — gap since the last successful check (ADR-0106)
        if: steps.gate.outputs.enabled == 'true' && vars.USAGE_CRON_ACTIVE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/usage.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].created_at // empty')
          [ -n "$prev" ] || exit 0
          gap=$(( $(date -u +%s) - $(date -u -d "$prev" +%s) ))
          echo "gap since last successful check: $((gap / 60)) min (this run: $GITHUB_EVENT_NAME)"
          [ "$gap" -gt 7200 ] || exit 0
          body="비용 감시 실행 간격 $((gap / 60))분(2시간 초과) — 30분 트리거 sanpo-usage-cron(apps/usage-cron, ADR-0106)이 멈췄을 수 있다. 직전 성공 ${prev}, 이번 실행 ${GITHUB_EVENT_NAME}. 확인: Cloudflare 대시보드 Workers & Pages → sanpo-usage-cron → 로그(Cron 실패·workflow_dispatch 401/403), PAT(GITHUB_DISPATCH_TOKEN) 만료. 절차 docs/13 §6.1."
          echo "::warning::$body"
          open=$(gh issue list --label cf-usage-watchdog --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue edit "$open" --body "$body"
          else
            gh label create cf-usage-watchdog --force --color FBCA04 --description 'Cost watch cadence gap' >/dev/null
            gh issue create --title '비용 감시 실행 간격 2시간 초과' --label cf-usage-watchdog --body "$body"
          fi
      - name: Usage vs plan allowance (issue above 70 %) + cost circuit breaker
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PLAN: ${{ vars.CF_PLAN || 'paid' }}
          CF_BILLING_DAY: ${{ vars.CF_BILLING_DAY || '25' }}
          GH_TOKEN: ${{ github.token }}
          # 차단 전용 존 토큰(Zone → WAF: Edit + Zone → Zone: Read). 없으면 차단을 건너뛴다.
          CF_KILLSWITCH_TOKEN: ${{ secrets.CF_KILLSWITCH_TOKEN }}
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
        run: node scripts/cf-usage.ts --github-issue --kill-switch
