# main 병합 → staging(tokyo-sanpo-staging) 자동 배포 → Environment "production" 수동 승인 → production(tokyo-sanpo). see docs/13-deployment.md §7
# 새 실행은 승인 대기 중인 옛 실행을 취소한다(supersede 잡) — production 승인 대상은 항상 최신 main 하나(ADR-0103).
# 시크릿(CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)이 없으면 배포 단계를 건너뛰고 성공 처리한다.
# 시크릿 값은 wrangler 프로세스 env로만 전달하고 echo/인자로 쓰지 않는다(Actions 로그 마스킹은 보조 수단).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'
  FORCE_COLOR: '0'

defaults:
  run:
    shell: bash

jobs:
  # 최신 main만 production 승인 대상(ADR-0103): 새 Deploy 실행이 시작되면 이보다 먼저 시작돼 production 승인을 기다리는(waiting) 실행을 취소한다.
  # 아직 staging 단계였던 옛 실행이 나중에 승인 대기에 들어가도 production 잡 첫 단계(main 머리 확인)에서 멈춘다.
  supersede:
    name: supersede older deploys waiting for approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # 같은 워크플로의 옛 실행 취소
    steps:
      - name: Cancel older Deploy runs waiting for production approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          older=".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .run_number < $GITHUB_RUN_NUMBER) | .id"
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?status=waiting&per_page=50" --jq "$older")
          for id in $ids; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null
            echo "Cancelled older Deploy run $id (was waiting for production approval)" >> "$GITHUB_STEP_SUMMARY"
          done
          [ -n "$ids" ] || echo "No older Deploy run waiting for approval." >> "$GITHUB_STEP_SUMMARY"

  staging:
    name: staging (tokyo-sanpo-staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Check Cloudflare secrets
        id: gate
        env:
          # 값이 아닌 존재 여부(true/false)만 전달한다.
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not available — skipping deploy."
            echo "Deploy skipped: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not available." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      - name: Build
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm build && pnpm check:assets
      - name: Deploy to staging
        id: deploy
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-staging.ndjson
        run: |
          pnpm exec wrangler deploy --env staging --message "main@${GITHUB_SHA::7}"
          url=$(jq -r 'select(.type == "deploy") | .targets[]? | select(endswith("workers.dev"))' "$WRANGLER_OUTPUT_FILE_PATH" | head -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Staging deployed: ${url:-(no workers.dev URL)}" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test staging
        if: steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: .github/scripts/smoke.sh "$URL"

  production:
    name: production (tokyo-sanpo)
    needs: staging
    # main에서 시작한 실행만(workflow_dispatch로 다른 브랜치를 production에 올리지 못하게).
    if: needs.staging.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 승인 게이트: Settings → Environments → production → Required reviewers.
    environment:
      name: production
      url: https://earthaimap.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # 환경 보호 규칙 조회
    steps:
      - name: Only the latest main is deployable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 승인 대기 중 main이 앞서 나갔으면(더 새 Deploy 실행이 있음) 옛 커밋을 production에 올리지 않는다.
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::Superseded — main is now ${head::7}, this run is ${GITHUB_SHA::7}. Approve the newest Deploy run instead."
            exit 1
          fi
      - name: Require manual approval rule on the production environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 환경이 보호 규칙 없이 자동 생성된 경우 승인 없이 이 잡이 시작된다 → 배포 전에 중단한다.
          reviewers=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/production" \
            | jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')
          if [ "$reviewers" -lt 1 ]; then
            echo "::error::Environment 'production' has no required reviewers — configure it before production deploys (see PR description / PROGRESS.md)."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build
        # 테스트 픽스처(world-mini)는 production 정적 에셋에서 뺀다(staging·PR preview만 `?world=mini` 지원, docs/13 §7).
        # 진단 도구(`?ui-sandbox=1`·`?probe=`·`?report=force`)도 번들째 뺀다(ADR-0103). `?spawn=`·`?debug=1`은 유지.
        env:
          SANPO_WORLD_MINI: '0'
          SANPO_DEBUG_TOOLS: '0'
        run: pnpm build && pnpm check:assets
      - name: Deploy to production
        id: deploy
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-production.ndjson
        run: |
          pnpm exec wrangler deploy --env="" --message "main@${GITHUB_SHA::7}"
          echo "Production deployed: https://earthaimap.com (workers.dev off — ADR-0103)" >> "$GITHUB_STEP_SUMMARY"
      # production은 workers.dev가 꺼져 있다(ADR-0103) → 공개 도메인으로 스모크(존 WAF·킬 스위치를 거치는 실제 경로).
      - name: Smoke test production
        run: .github/scripts/smoke.sh https://earthaimap.com
