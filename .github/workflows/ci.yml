# PR·main 품질 게이트: check(biome+tsc+depcruise+size) → test → build → 에셋 크기, e2e 부트 스모크(world-mini), 기록 누락 검사, 보안(gitleaks·pnpm audit). see docs/13-deployment.md §7, docs/14-testing-perf.md §5
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: 'false'

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 24 = .nvmrc 기본, 22 = engines 하한(ADR-0011). 22.x 최신은 type-stripping 기본 활성(22.18+).
        node: ['24', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Lint · typecheck · depcruise · size (pnpm check)
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Build (game vite build + worker dry-run bundle)
        run: pnpm build
      - name: Static asset limits (25 MiB/file, 20k files)
        run: pnpm check:assets

  e2e:
    name: e2e (playwright chromium · world-mini)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install Chromium (headless shell)
        run: pnpm exec playwright install --with-deps --only-shell chromium
      # webServer가 게임을 빌드(dist/fixtures/world-mini 포함)한 뒤 vite preview로 띄운다(tests/e2e/playwright.config.ts).
      - name: Boot + render smoke (?world=mini, WebGL2/SwiftShader)
        run: pnpm test:e2e
      # M01-T06: 시작 화면·원점 재설정 후 스크린샷(tests/e2e/render.spec.ts) — 리뷰어가 렌더 변경을 눈으로 확인.
      - name: Upload render screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: test-results/screenshots/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  records:
    name: records (codemap · module cards · PROGRESS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # PR merge-base 계산용
      - uses: ./.github/actions/setup
      - name: CODEMAP is up to date
        run: |
          pnpm codemap
          if [ -n "$(git status --porcelain -- docs/generated/CODEMAP.md)" ]; then
            echo "::error file=docs/generated/CODEMAP.md::CODEMAP.md is stale — run 'pnpm codemap' and commit the result."
            git --no-pager diff --stat -- docs/generated/CODEMAP.md
            git --no-pager diff -- docs/generated/CODEMAP.md | head -n 60
            exit 1
          fi
      - name: Module cards (fail) · PROGRESS.md (warn)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm check:records --base "$BASE_SHA"

  # 보안 게이트(ADR-0103): 비밀값 탐지(gitleaks, 전체 이력) + 의존성 감사(pnpm audit, 모든 심각도). 기존 필수 체크 4개와 별개 —
  # 필수로 만들지는 저장소 ruleset에서 정한다(docs/13 §7).
  security:
    name: security (gitleaks · dependency audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 전체 이력 비밀값 탐지
      - name: Secret scan (gitleaks, full history, redacted)
        env:
          GITLEAKS_VERSION: 8.30.1
          # gitleaks_8.30.1_checksums.txt(공식 릴리스)의 linux_x64 값.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tgz="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1
      # pnpm audit은 lockfile만 읽는다(설치 불필요). 예외가 필요하면 package.json pnpm.auditConfig.ignoreGhsas + ADR에 사유·만료.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Dependency audit (pnpm audit, all severities)
        run: pnpm audit --audit-level low
