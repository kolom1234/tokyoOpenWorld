# 의존성 자동 업데이트(ADR-0103): GitHub Actions(커밋 SHA 고정 + 태그 주석을 함께 갱신)·npm(pnpm 워크스페이스) 주간.
# 새 릴리스는 7일 묵힌 뒤 제안(cooldown — 공급망 사고 대비). Dependabot PR은 시크릿이 없어 preview/deploy를 건너뛴다(docs/13 §7).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: build
