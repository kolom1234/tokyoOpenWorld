# 의존성 자동 업데이트(ADR-0103): GitHub Actions(커밋 SHA 고정 + 태그 주석을 함께 갱신)·npm(pnpm 워크스페이스) 주간.
# 새 릴리스는 7일 묵힌 뒤 제안(cooldown — 공급망 사고 대비). Dependabot PR은 시크릿이 없어 preview/deploy를 건너뛴다(docs/13 §7).
version: 2
updates:
  - package-ecosystem: github-actions
    # '/'는 .github/workflows만 본다 — composite 액션(.github/actions/setup)의 pnpm/action-setup 등은 따로 지정.
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # TS 7(네이티브 컴파일러)은 JS 컴파일러 API가 없다 — scripts/lib/size-rules.ts·tools/codemap이 쓴다. 전환은 별도 ADR(docs/02).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # 타입은 지원 하한 Node 22 API로 고정(ADR-0011·0014) — 26은 TypedArray<ArrayBufferLike> 변경으로 tsc 실패.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: build
